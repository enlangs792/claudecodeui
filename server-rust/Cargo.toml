[package]
name = "cloudcli-server"
description = "CloudCLI Server — Rust rewrite of the CloudCLI backend"
version = "1.32.0"
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "cloudcli-server"

[[bin]]
name = "cloudcli-server"
path = "src/main.rs"

[[bin]]
name = "cloudcli"
path = "src/cli/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
diesel = { version = "2", features = ["sqlite", "mysql", "postgres", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite", "mysql", "postgres"] }
r2d2 = "0.8"
jsonwebtoken = "9"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
mime_guess = "2"
base64 = "0.22"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
